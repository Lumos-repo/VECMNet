<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">文本到图像行人重识别训练框架图</title>
  <desc id="desc">KL 和 PNCL 被放置在 CGR 一致性引导细化模块内部。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .page { fill: #fff; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 3; }
      .smallbox { fill: #fff; stroke: #111; stroke-width: 1.7; rx: 3; }
      .module { fill: #fff; stroke: #111; stroke-width: 2; rx: 3; }
      .dash { fill: #fff; stroke: #111; stroke-width: 1.8; stroke-dasharray: 6 5; rx: 3; }
      .arrow { fill: none; stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #111; stroke-width: 2; }
      .thin { fill: none; stroke: #111; stroke-width: 1.6; marker-end: url(#arrow); }
      .text { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111; font-size: 18px; }
      .small { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111; font-size: 15px; }
      .tiny { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111; font-size: 13px; }
      .label { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111; font-size: 20px; font-weight: 700; }
      .loss { font-family: "Times New Roman", serif; fill: #111; font-size: 19px; font-style: italic; }
      .sub { font-family: "Times New Roman", serif; baseline-shift: sub; font-size: 12px; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1320" height="760"/>

  <!-- Top training loop -->
  <text class="label" x="640" y="36" text-anchor="middle">更新模型，下一轮训练</text>
  <path class="arrow" d="M 500 54 V 118"/>
  <path class="line" d="M 500 54 H 1250 V 604"/>
  <path class="arrow" d="M 1250 604 H 1196"/>

  <!-- Dataset and preprocessing -->
  <rect class="box" x="16" y="130" width="56" height="385"/>
  <text class="text" x="44" y="164" text-anchor="middle">
    <tspan x="44" dy="0">文</tspan>
    <tspan x="44" dy="27">本</tspan>
    <tspan x="44" dy="27">到</tspan>
    <tspan x="44" dy="27">图</tspan>
    <tspan x="44" dy="27">像</tspan>
    <tspan x="44" dy="27">行</tspan>
    <tspan x="44" dy="27">人</tspan>
    <tspan x="44" dy="27">重</tspan>
    <tspan x="44" dy="27">识</tspan>
    <tspan x="44" dy="27">别</tspan>
    <tspan x="44" dy="27">数</tspan>
    <tspan x="44" dy="27">据</tspan>
  </text>

  <path class="arrow" d="M 72 322 H 112"/>
  <rect class="box" x="112" y="286" width="150" height="78"/>
  <text class="label" x="187" y="312" text-anchor="middle">数据预处理</text>
  <text class="small" x="187" y="336" text-anchor="middle">图像缩放、归一化</text>
  <text class="small" x="187" y="358" text-anchor="middle">文本分词、随机掩码</text>

  <path class="line" d="M 262 322 H 302"/>
  <path class="arrow" d="M 302 322 V 206 H 338"/>
  <path class="arrow" d="M 302 322 V 448 H 338"/>

  <rect class="smallbox" x="338" y="188" width="58" height="56"/>
  <text class="small" x="367" y="211" text-anchor="middle">图像</text>
  <text class="small" x="367" y="233" text-anchor="middle">输入</text>
  <rect class="smallbox" x="338" y="430" width="58" height="56"/>
  <text class="small" x="367" y="453" text-anchor="middle">文本</text>
  <text class="small" x="367" y="475" text-anchor="middle">输入</text>

  <!-- Encoders -->
  <path class="arrow" d="M 396 216 H 432"/>
  <path class="arrow" d="M 396 458 H 432"/>

  <rect class="module" x="432" y="140" width="265" height="150"/>
  <text class="label" x="565" y="170" text-anchor="middle">CLIP图像编码器</text>
  <text class="small" x="565" y="194" text-anchor="middle">ViT-B/16</text>
  <rect class="smallbox" x="448" y="218" width="72" height="48"/>
  <text class="tiny" x="484" y="238" text-anchor="middle">Patch</text>
  <text class="tiny" x="484" y="256" text-anchor="middle">Embedding</text>
  <rect class="smallbox" x="532" y="218" width="78" height="48"/>
  <text class="tiny" x="571" y="248" text-anchor="middle">Transformer</text>
  <rect class="smallbox" x="622" y="218" width="60" height="48"/>
  <text class="tiny" x="652" y="248" text-anchor="middle">投影层</text>

  <rect class="module" x="432" y="384" width="265" height="140"/>
  <text class="label" x="565" y="414" text-anchor="middle">CLIP文本编码器</text>
  <rect class="smallbox" x="448" y="454" width="72" height="48"/>
  <text class="tiny" x="484" y="474" text-anchor="middle">Token</text>
  <text class="tiny" x="484" y="492" text-anchor="middle">Embedding</text>
  <rect class="smallbox" x="532" y="454" width="78" height="48"/>
  <text class="tiny" x="571" y="484" text-anchor="middle">Transformer</text>
  <rect class="smallbox" x="622" y="454" width="60" height="48"/>
  <text class="tiny" x="652" y="484" text-anchor="middle">投影层</text>

  <!-- Feature blocks -->
  <path class="line" d="M 697 215 H 716"/>
  <path class="line" d="M 697 454 H 716"/>
  <path class="line" d="M 716 215 V 454"/>
  <path class="arrow" d="M 716 252 H 735"/>
  <path class="arrow" d="M 716 382 H 735"/>

  <rect class="box" x="735" y="224" width="130" height="60"/>
  <text class="small" x="800" y="248" text-anchor="middle">全局图文特征</text>
  <text class="small" x="800" y="271" text-anchor="middle">512维</text>

  <rect class="box" x="735" y="354" width="130" height="60"/>
  <text class="small" x="800" y="378" text-anchor="middle">局部增强特征</text>
  <text class="small" x="800" y="401" text-anchor="middle">1024维</text>

  <!-- VNM -->
  <rect class="module" x="930" y="150" width="170" height="92"/>
  <text class="small" x="1015" y="176" text-anchor="middle">VNM 变分噪声建模</text>
  <text class="tiny" x="1015" y="200" text-anchor="middle">双尺度损失分布建模</text>
  <text class="tiny" x="1015" y="222" text-anchor="middle">干净/噪声样本划分</text>

  <path class="arrow" d="M 865 254 C 890 240 902 202 930 196"/>
  <path class="arrow" d="M 865 384 C 895 365 905 230 930 212"/>

  <rect class="smallbox" x="1134" y="161" width="78" height="42"/>
  <text class="loss" x="1173" y="187" text-anchor="middle">L<tspan class="sub">match</tspan></text>
  <path class="arrow" d="M 1100 190 H 1134"/>

  <!-- CGR -->
  <rect class="module" x="930" y="286" width="170" height="92"/>
  <text class="small" x="1015" y="314" text-anchor="middle">CGR 一致性引导细化</text>
  <text class="tiny" x="1015" y="338" text-anchor="middle">置信度融合</text>
  <text class="tiny" x="1015" y="360" text-anchor="middle">伪标签优化</text>

  <rect class="smallbox" x="1134" y="296" width="78" height="42"/>
  <text class="loss" x="1173" y="322" text-anchor="middle">L<tspan class="sub">KL</tspan></text>
  <rect class="smallbox" x="1134" y="354" width="78" height="42"/>
  <text class="loss" x="1173" y="380" text-anchor="middle">L<tspan class="sub">PNCL</tspan></text>

  <path class="arrow" d="M 865 254 C 895 280 904 322 930 326"/>
  <path class="arrow" d="M 865 384 C 892 378 904 354 930 352"/>
  <path class="arrow" d="M 1100 317 H 1134"/>
  <path class="arrow" d="M 1100 375 H 1134"/>

  <!-- CMM -->
  <rect class="module" x="930" y="515" width="180" height="76"/>
  <text class="small" x="1020" y="544" text-anchor="middle">CMM 跨模态掩码建模</text>
  <text class="tiny" x="1020" y="568" text-anchor="middle">图像辅助文本重建</text>
  <rect class="smallbox" x="1134" y="532" width="78" height="42"/>
  <text class="loss" x="1173" y="558" text-anchor="middle">L<tspan class="sub">CMM</tspan></text>
  <path class="arrow" d="M 1110 553 H 1134"/>

  <path class="arrow" d="M 865 254 C 895 330 898 510 930 542"/>
  <path class="arrow" d="M 865 384 C 895 430 900 510 930 556"/>

  <!-- Retrieval branch -->
  <path class="line" d="M 800 414 V 648 H 1072"/>
  <path class="arrow" d="M 1072 648 H 1110"/>
  <rect class="box" x="1110" y="614" width="158" height="76"/>
  <text class="small" x="1189" y="640" text-anchor="middle">文本查询图像库</text>
  <text class="small" x="1189" y="664" text-anchor="middle">Top-K检索结果</text>

  <!-- Total loss -->
  <rect class="box" x="1240" y="320" width="72" height="74"/>
  <text class="label" x="1276" y="362" text-anchor="middle">总损失</text>
  <text class="loss" x="1276" y="386" text-anchor="middle">L</text>

  <path class="arrow" d="M 1212 182 C 1238 205 1250 260 1270 320"/>
  <path class="arrow" d="M 1212 317 H 1240"/>
  <path class="arrow" d="M 1212 375 H 1240"/>
  <path class="arrow" d="M 1212 553 C 1240 522 1262 438 1272 394"/>
  <path class="arrow" d="M 1268 652 C 1290 590 1290 456 1278 394"/>
</svg>
